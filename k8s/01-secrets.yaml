# =============================================================================
# SECRETS - Sensitive Configuration
# =============================================================================
# Purpose:
#   Secrets are like ConfigMaps, but specifically designed for sensitive data
#   (passwords, tokens, TLS keys). K8s stores them separately with optional
#   encryption at rest.
#
# IMPORTANT SECURITY NOTES (READ THIS!):
#   1. This file contains PLAINTEXT secrets. In a REAL production environment,
#      NEVER commit this file to Git. Use one of these instead:
#        - Sealed Secrets (Bitnami)   → encrypts secrets, safe to commit
#        - External Secrets Operator  → pulls from AWS Secrets Manager/Vault
#        - SOPS (Mozilla)            → encrypts YAML files with cloud KMS
#        - Vault (HashiCorp)         → dynamic secrets, no YAML at all
#
#   2. Base64 is NOT encryption! `echo -n "password" | base64` is just encoding.
#      Anyone can decode it. K8s Secrets are base64-encoded, but that's for
#      binary safety, NOT security.
#
#   3. For THIS LEARNING PROJECT, plain secrets in Git are acceptable because:
#      - It's a local/dev cluster
#      - Credentials are placeholders (you MUST change them for any real use)
#      - It makes the learning process transparent
#
# How Pods consume Secrets (same 3 ways as ConfigMaps):
#   - Environment variables  (simplest, but env vars can leak via `printenv`)
#   - Mounted files          (most secure — never in process memory via env)
#   - Image pull secrets     (to pull from private registries)
#   We use environment variables for simplicity, but mount files in production.
#
# How the data is structured:
#   The "stringData" field lets us write PLAINTEXT — K8s auto-encodes to base64
#   when storing. If we used "data" instead, we'd need to provide base64 values.
#   Using stringData is MUCH more readable. Thank me later.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm-system
  labels:
    app: microcrm
type: Opaque                     # "Opaque" = generic key-value secret (most common)
                                 # Other types: kubernetes.io/tls, kubernetes.io/dockerconfigjson

stringData:                      # Write in PLAINTEXT → K8s stores as base64 automatically
  # ---- PostgreSQL Credentials ----
  # These MUST match what you configured when creating the PostgreSQL database.
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "password"          # CHANGE THIS for any real environment!

  # ---- Full Database Connection String ----
  # This is constructed from ConfigMap + Secret values.
  # Some frameworks (Prisma, TypeORM) prefer a single DATABASE_URL.
  # Note: ${POSTGRES_HOST} is NOT resolved here — it comes from ConfigMap.
  # The actual URL is assembled in the Deployment using both sources.
  DATABASE_URL: "postgresql://user:password@postgres-service:5432/crm"

  # ---- JWT Secret ----
  # This is the key used to sign and verify JSON Web Tokens for authentication.
  # SECURITY: Use a long (32+ char), random string. Generate with:
  #   openssl rand -base64 32
  JWT_SECRET: "change-me-to-a-secure-random-string"

  # ---- Admin Credentials ----
  # Default admin account created on first run by the API service.
  # CHANGE IMMEDIATELY after first login in any non-local environment.
  ADMIN_PASSWORD: "admin123"